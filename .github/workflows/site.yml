name: Build and Deploy Chinese Docs

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LinxISA/linx-isa
        uses: actions/checkout@v7
        with:
          repository: LinxISA/linx-isa
          ref: main
          path: linx-isa
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install MkDocs and Material theme
        run: python -m pip install --upgrade pip "mkdocs<2" mkdocs-material

      - name: Validate documentation contracts
        working-directory: linx-isa
        run: python3 docs/check_documentation.py --root .

      - name: Build English documentation for strict validation
        working-directory: linx-isa
        run: mkdocs build --strict --site-dir "${RUNNER_TEMP}/site-en"

      - name: Build Chinese root Pages site
        working-directory: linx-isa
        run: mkdocs build --strict --config-file mkdocs.zh.yml --site-dir site

      - name: Record source revision
        working-directory: linx-isa
        run: git rev-parse HEAD > site/.linxisa-source-revision

      - name: Upload Chinese Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: linx-isa/site/

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to organization Pages
        id: deployment
        uses: actions/deploy-pages@v5
